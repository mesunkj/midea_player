<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Midea Player</title>
    <meta name="description" content="跨平台多視窗圖片輪播系統 — Android 版" />
    <style>
      /* 防止 iOS/Android 彈性回彈與文字選取 */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* html 層不鎖 overflow，讓子元件可捲動 */
        overflow: hidden;
        background: #0f1117;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* body 不鎖死 overflow，讓各 view 的捲動容器正常運作 */
        overflow: hidden;
        background: #0f1117;
      }
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1117;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
